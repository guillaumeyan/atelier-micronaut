opencollection: 1.0.0
info:
  name: atelier-micronaut
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: matrix-app
      type: folder
      seq: 1
    request:
      auth: inherit
    items:
      - info:
          name: combattre
          type: http
          seq: 2
        http:
          method: POST
          url: http://localhost:8080/matrix/combat
          body:
            type: json
            data: |-
              {
                "combattantEquipeA": [ "Thomas Anderson"],
                "combattantEquipeB" : ["Morpheus"]
              }
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: health
          type: http
          seq: 3
        http:
          method: GET
          url: http://localhost:8080/beans
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: tous les personnages
          type: http
          seq: 1
        http:
          method: GET
          url: http://localhost:8080/matrix/personnages
          params:
            - name: nom
              value: 'n'
              type: query
              disabled: true
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: beans
          type: http
          seq: 4
        http:
          method: GET
          url: http://localhost:8080/beans
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: env
          type: http
          seq: 5
        http:
          method: GET
          url: http://localhost:8080/env
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
  - info:
      name: environnement-matrix-app
      type: folder
      seq: 2
    request:
      auth: inherit
    items:
      - info:
          name: Environnements de combat aléatoire
          type: http
          seq: 3
        http:
          method: GET
          url: http://localhost:8081/matrix/environnement-combat
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
      - info:
          name: Tous les environnements de combat
          type: http
          seq: 1
        http:
          method: GET
          url: http://localhost:8081/matrix/environnements-combat
          auth: inherit
        settings:
          encodeUrl: true
          timeout: 0
          followRedirects: true
          maxRedirects: 5
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-06-15T13:16:30.225Z'
    exportedUsing: Bruno
